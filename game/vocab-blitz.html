<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Blitz Arena</title>
    <style>
        :root {
            --red: #e21b3c;
            --blue: #1368ce;
            --yellow: #ffa602;
            --green: #26890c;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 550px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Screen States */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* Theme Selector Grid */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .theme-card {
            background: #334155;
            border: 2px solid #475569;
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .theme-card:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
            background: #475569;
        }

        .theme-card h3 {
            font-size: 1.1rem;
            color: #f1f5f9;
        }

        .theme-card p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Game Screen */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background: #0f172a;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
        }

        .hud-item {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .timer-bar-container {
            width: 100%;
            height: 10px;
            background: #334155;
            border-radius: 5px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: #38bdf8;
            transition: width 0.1s linear;
        }

        .question-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .target-word {
            font-size: 2.2rem;
            color: #facc15;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .option-btn {
            border: none;
            border-radius: 12px;
            padding: 1.2rem;
            font-size: 1.05rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-align: left;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .option-btn:hover {
            filter: brightness(1.15);
            transform: scale(1.01);
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .shape-icon {
            font-size: 1.5rem;
            display: inline-block;
            width: 30px;
            text-align: center;
        }

        .btn-red { background-color: var(--red); }
        .btn-blue { background-color: var(--blue); }
        .btn-yellow { background-color: var(--yellow); }
        .btn-green { background-color: var(--green); }

        /* End Screen */
        .results-box {
            text-align: center;
            padding: 2rem;
        }

        .final-score {
            font-size: 4rem;
            color: #facc15;
            margin: 1rem 0;
            font-weight: 800;
        }

        .stats-list {
            list-style: none;
            margin: 1.5rem 0;
            font-size: 1.2rem;
            line-height: 2rem;
        }

        .restart-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .restart-btn:hover {
            background: #7dd3fc;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .target-word {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>Vocab Blitz</h1>
    </header>

    <!-- 1. THEME SELECTION SCREEN -->
    <div id="selection-screen" class="screen active">
        <h2 style="text-align: center; margin-bottom: 0.5rem;">Choose Today's Mission Theme</h2>
        <p style="text-align: center; color: #94a3b8;">10 Questions | 10 Seconds Per Word</p>
        <div class="theme-grid" id="theme-grid"></div>
    </div>

    <!-- 2. GAMEPLAY SCREEN -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="hud-item" id="theme-title">Theme</div>
            <div class="hud-item" id="question-tracker">1 / 10</div>
            <div class="hud-item" id="score-tracker">Score: 0</div>
        </div>

        <div class="timer-bar-container">
            <div class="timer-bar" id="timer-bar"></div>
        </div>

        <div class="question-box">
            <div class="target-word" id="target-word">WORD</div>
            <p style="color: #94a3b8;">Select the correct definition:</p>
        </div>

        <div class="options-grid">
            <button class="option-btn btn-red" onclick="submitAnswer(0)">
                <span class="shape-icon">▲</span>
                <span class="opt-text" id="opt0">Option 1</span>
            </button>
            <button class="option-btn btn-blue" onclick="submitAnswer(1)">
                <span class="shape-icon">◆</span>
                <span class="opt-text" id="opt1">Option 2</span>
            </button>
            <button class="option-btn btn-yellow" onclick="submitAnswer(2)">
                <span class="shape-icon">●</span>
                <span class="opt-text" id="opt2">Option 3</span>
            </button>
            <button class="option-btn btn-green" onclick="submitAnswer(3)">
                <span class="shape-icon">■</span>
                <span class="opt-text" id="opt3">Option 4</span>
            </button>
        </div>
    </div>

    <!-- 3. FINAL RESULTS SCREEN -->
    <div id="results-screen" class="screen">
        <div class="results-box">
            <h2>Mission Complete!</h2>
            <div class="final-score" id="final-score">0</div>
            <p id="performance-rank" style="font-size: 1.4rem; color: #38bdf8;"></p>
            
            <ul class="stats-list">
                <li>Correct Answers: <strong id="correct-count">0</strong> / 10</li>
                <li>Accuracy: <strong id="accuracy-percent">0%</strong></li>
            </ul>

            <button class="restart-btn" onclick="showSelectionScreen()">Play Another Theme</button>
        </div>
    </div>
</div>

            { word: "Clue", correct: "A fact or detail that helps solve a puzzle or find a meaning", distractors: ["A rule in a book", "A typo", "A blank page"] },
            { word: "Guess", correct: "To form an opinion or answer without knowing for sure", distractors: ["To look up in a dictionary", "To know 100% facts", "To state a proven law"] },
            { word: "Meaning", correct: "What a word, sign, or action represents", distractors: ["The spelling of a word", "The length of a word", "The page number"] },
            { word: "Sentence", correct: "A group of words that expresses a complete thought", distractors: ["A single letter", "A page cover", "A single number"] },
            { word: "Text", correct: "The written or printed words in a book, passage, or article", distractors: ["A picture drawing", "A video clip", "A spoken song"] },
            { word: "Title", correct: "The name given to a book, story, or article", distractors: ["The last page", "An author name", "A price tag"] },
            { word: "Topic", correct: "The main subject or idea that a text is about", distractors: ["A tiny detail", "A page margin", "A spelling error"] },
            { word: "Unfamiliar", correct: "Not known or recognized; new to you", distractors: ["Very famous", "Well known", "Easy to remember"] },
            { word: "Word", correct: "A single unit of language used to build sentences", distractors: ["A full chapter", "A whole book", "A paragraph"] },
            { word: "Unknown", correct: "Something that is not known or identified yet", distractors: ["A clear fact", "A famous person", "A solved riddle"] }
        ]
    }
};

// State Variables
let currentTheme = null;
let currentQuestionIndex = 0;
let score = 0;
let correctAnswersCount = 0;
let timer = null;
let timeLeft = 10;
let canAnswer = true;

// DOM Elements
const selectionScreen = document.getElementById('selection-screen');
const gameScreen = document.getElementById('game-screen');
const resultsScreen = document.getElementById('results-screen');
const themeGrid = document.getElementById('theme-grid');

// Render Theme Grid
function initThemes() {
    themeGrid.innerHTML = '';
    for (let id in vocabularyData) {
        let theme = vocabularyData[id];
        let card = document.createElement('div');
        card.className = 'theme-card';
        card.onclick = () => startGame(id);
        card.innerHTML = `
            <h3>${theme.name}</h3>
            <p>${theme.desc}</p>
        `;
        themeGrid.appendChild(card);
    }
}

function showSelectionScreen() {
    resultsScreen.classList.remove('active');
    gameScreen.classList.remove('active');
    selectionScreen.classList.add('active');
}

function startGame(themeId) {
    currentTheme = vocabularyData[themeId];
    currentQuestionIndex = 0;
    score = 0;
    correctAnswersCount = 0;

    document.getElementById('theme-title').innerText = currentTheme.name;
    
    selectionScreen.classList.remove('active');
    resultsScreen.classList.remove('active');
    gameScreen.classList.add('active');

    loadQuestion();
}

function loadQuestion() {
    if (currentQuestionIndex >= currentTheme.words.length) {
        endGame();
        return;
    }

    canAnswer = true;
    let qData = currentTheme.words[currentQuestionIndex];
    
    // UI Updates
    document.getElementById('question-tracker').innerText = `${currentQuestionIndex + 1} / ${currentTheme.words.length}`;
    document.getElementById('score-tracker').innerText = `Score: ${score}`;
    document.getElementById('target-word').innerText = qData.word;

    // Shuffle Options
    let options = [qData.correct, ...qData.distractors];
    options.sort(() => Math.random() - 0.5);

    for (let i = 0; i < 4; i++) {
        let btn = document.getElementById(`opt${i}`);
        btn.innerText = options[i];
        btn.parentElement.dataset.isCorrect = (options[i] === qData.correct);
    }

    startTimer();
}

function startTimer() {
    clearInterval(timer);
    timeLeft = 10;
    const timerBar = document.getElementById('timer-bar');
    timerBar.style.width = '100%';

    timer = setInterval(() => {
        timeLeft -= 0.1;
        let percentage = (timeLeft / 10) * 100;
        timerBar.style.width = `${percentage}%`;

        if (timeLeft <= 0) {
            clearInterval(timer);
            handleTimeout();
        }
    }, 100);
}

function handleTimeout() {
    if (!canAnswer) return;
    canAnswer = false;
    nextQuestion();
}

function submitAnswer(optionIndex) {
    if (!canAnswer) return;
    canAnswer = false;
    clearInterval(timer);

    let selectedBtn = document.getElementById(`opt${optionIndex}`).parentElement;
    let isCorrect = selectedBtn.dataset.isCorrect === "true";

    if (isCorrect) {
        let timeBonus = Math.round(timeLeft * 100);
        let questionPoints = 1000 + timeBonus;
        score += questionPoints;
        correctAnswersCount++;
    }

    setTimeout(() => {
        nextQuestion();
    }, 400);
}

function nextQuestion() {
    currentQuestionIndex++;
    loadQuestion();
}

function endGame() {
    clearInterval(timer);
    gameScreen.classList.remove('active');
    resultsScreen.classList.add('active');

    document.getElementById('final-score').innerText = score.toLocaleString();
    document.getElementById('correct-count').innerText = correctAnswersCount;
    
    let accuracy = Math.round((correctAnswersCount / currentTheme.words.length) * 100);
    document.getElementById('accuracy-percent').innerText = `${accuracy}%`;

    let rankText = "Keep Practicing!";
    if (accuracy >= 90) rankText = "🏆 Vocab Master!";
    else if (accuracy >= 70) rankText = "⭐ Sharp Scholar!";
    else if (accuracy >= 50) rankText = "👍 Good Effort!";

    document.getElementById('performance-rank').innerText = rankText;
}

// Initialize on page load
initThemes();
</script>
</body>
</html>
